{% extends "base.html" %}
{% block title %}Lirisense - Регистрация{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h1>Регистрация</h1>
        <form method="POST">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="login" placeholder="Минимум 3 символа" required minlength="3">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Минимум 4 символа" required minlength="4">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Создать аккаунт</button>
        </form>
        <p class="auth-link">Есть аккаунт? <a href="/login">Войти</a></p>
    </div>
</section>
{% endblock %}
