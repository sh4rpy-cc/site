{% extends "base.html" %}
{% block title %}Регистрация — liratine.tg{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <h1>Регистрация</h1>
        <p class="auth-subtitle">Для создания аккаунта необходим инвайт-код</p>

        <form method="POST">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="login" placeholder="Минимум 3 символа" required minlength="3">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Минимум 4 символа" required minlength="4">
            </div>
            <div class="form-group invite-input-wrapper">
                <label>Инвайт-код</label>
                <input type="text" name="invite_code" placeholder="XXXX-XXXX-XXXX-XXXX" required maxlength="16" pattern=".{16}" title="Ровно 16 символов">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Создать аккаунт</button>
        </form>

        <p class="auth-link">Уже есть аккаунт? <a href="/login">Войти</a></p>
    </div>
</section>
{% endblock %}
