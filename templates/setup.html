{% extends "base.html" %}
{% block title %}Lirisense - Настройка{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="setup-badge">Первый запуск</div>
        <h1>Настройка админа</h1>
        <p class="setup-desc">Создайте администратора для управления сайтом</p>
        <form method="POST">
            <div class="form-group">
                <label>Никнейм</label>
                <input type="text" name="login" placeholder="Ваш никнейм" required minlength="3">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Минимум 4 символа" required minlength="4">
            </div>
            <div class="form-group">
                <label>Повторите пароль</label>
                <input type="password" name="password2" placeholder="Ещё раз пароль" required minlength="4">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Создать админа</button>
        </form>
    </div>
</section>
{% endblock %}
