{% extends "base.html" %}
{% block title %}Настройка — liratine.tg{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="auth-card">
        <div class="setup-badge">Первичная настройка</div>
        <h1>Создание админа</h1>
        <p class="auth-subtitle">Аккаунт администратора ещё не создан</p>

        <form method="POST">
            <div class="form-group">
                <label>Логин</label>
                <input type="text" name="login" placeholder="Минимум 3 символа" required minlength="3">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Минимум 4 символа" required minlength="4">
            </div>
            <div class="form-group">
                <label>Повторите пароль</label>
                <input type="password" name="password2" placeholder="Повторите пароль" required>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Создать аккаунт</button>
        </form>
    </div>
</section>
{% endblock %}
